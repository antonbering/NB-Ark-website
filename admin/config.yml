backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projekter"
    label: "Projekter"
    folder: "content/projekter"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Beskrivelse", name: "description", widget: "text" }
      - { label: "Billede", name: "image", widget: "image" }
      - { label: "År", name: "year", widget: "string" }
      - { label: "Kategori", name: "category", widget: "string" }

  - name: "nyheder"
    label: "Nyheder"
    folder: "content/nyheder"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Dato", name: "date", widget: "datetime" }
      - { label: "Billede", name: "image", widget: "image" }
      - { label: "Tekst", name: "body", widget: "markdown" }
